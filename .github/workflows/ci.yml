name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Architecture Gate
        run: npm run test:arch

      - name: Contract Gate
        run: npm run test:contracts

      - name: Phase 1 Proof Gate
        run: npm run test:proof

      - name: Standalone Boundary Flow
        run: npm run test:standalone
