<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic versus advisory authority</title>
  <desc id="desc">Manifest, path, snapshot, and AST facts feed deterministic gates that produce pass or block. Optional providers produce advisory sidecars that reach host policy but cannot alter the deterministic verdict.</desc>
  <defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:10}.det{fill:#ecfeff;stroke:#0891b2}.adv{fill:#fefce8;stroke:#ca8a04}.host{fill:#fff7ed;stroke:#ea580c}.verdict{fill:#f0fdf4;stroke:#16a34a}.label{font:600 18px Arial,sans-serif;fill:#0f172a}.small{font:14px Arial,sans-serif;fill:#334155}.edge{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.no{stroke:#dc2626}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker></defs>
  <rect class="bg" width="1120" height="430"/>
  <rect class="box det" x="45" y="90" width="220" height="110"/><text class="label" x="155" y="125" text-anchor="middle">deterministic facts</text><text class="small" x="155" y="152" text-anchor="middle">manifest, path, snapshot</text><text class="small" x="155" y="174" text-anchor="middle">and AST structure</text>
  <rect class="box det" x="350" y="90" width="210" height="110"/><text class="label" x="455" y="125" text-anchor="middle">deterministic gates</text><text class="small" x="455" y="152" text-anchor="middle">preflight, dryRun</text><text class="small" x="455" y="174" text-anchor="middle">auditDiff, revert</text>
  <rect class="box verdict" x="645" y="105" width="160" height="80"/><text class="label" x="725" y="138" text-anchor="middle">verdict</text><text class="small" x="725" y="162" text-anchor="middle">PASS or BLOCK</text>
  <rect class="box adv" x="45" y="275" width="220" height="96"/><text class="label" x="155" y="308" text-anchor="middle">optional providers</text><text class="small" x="155" y="334" text-anchor="middle">semantic, reference</text><text class="small" x="155" y="354" text-anchor="middle">ML, test runner</text>
  <rect class="box adv" x="350" y="275" width="210" height="96"/><text class="label" x="455" y="308" text-anchor="middle">advisory sidecars</text><text class="small" x="455" y="334" text-anchor="middle">unavailable, degraded</text><text class="small" x="455" y="354" text-anchor="middle">or metadata only</text>
  <rect class="box host" x="890" y="175" width="180" height="96"/><text class="label" x="980" y="211" text-anchor="middle">host policy</text><text class="small" x="980" y="237" text-anchor="middle">tests, retry, approval</text>
  <text class="small" x="710" y="315" text-anchor="middle">Advisory data can inform the host,</text><text class="small" x="710" y="337" text-anchor="middle">but it cannot change PASS/BLOCK.</text>
  <path class="edge" d="M265 145 H350"/><path class="edge" d="M560 145 H645"/><path class="edge" d="M805 145 C860 145 860 223 890 223"/><path class="edge" d="M265 323 H350"/><path class="edge dash" d="M560 323 C710 323 755 223 890 223"/><path class="edge dash no" d="M560 300 C650 260 655 205 645 170"/>
</svg>
