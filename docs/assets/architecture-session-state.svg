<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Supervised edit session state machine</title>
  <desc id="desc">Session states move from created through preflight, snapshot, edit, audit pass or audit block, revert, rollback template extraction, and close.</desc>
  <defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:10}.pass{fill:#f0fdf4;stroke:#16a34a}.block{fill:#fef2f2;stroke:#dc2626}.label{font:600 17px Arial,sans-serif;fill:#0f172a}.small{font:13px Arial,sans-serif;fill:#334155}.edge{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.red{stroke:#dc2626}.green{stroke:#16a34a}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker></defs>
  <rect class="bg" width="1120" height="440"/>
  <rect class="box" x="40" y="180" width="125" height="64"/><text class="label" x="103" y="217" text-anchor="middle">created</text>
  <rect class="box pass" x="215" y="180" width="165" height="64"/><text class="label" x="298" y="208" text-anchor="middle">preflighted</text><text class="small" x="298" y="230" text-anchor="middle">pass</text>
  <rect class="box block" x="215" y="305" width="165" height="64"/><text class="label" x="298" y="333" text-anchor="middle">preflighted</text><text class="small" x="298" y="355" text-anchor="middle">block</text>
  <rect class="box" x="430" y="180" width="135" height="64"/><text class="label" x="498" y="217" text-anchor="middle">snapshotted</text>
  <rect class="box" x="615" y="180" width="115" height="64"/><text class="label" x="673" y="217" text-anchor="middle">edited</text>
  <rect class="box pass" x="780" y="80" width="135" height="64"/><text class="label" x="848" y="108" text-anchor="middle">audited</text><text class="small" x="848" y="130" text-anchor="middle">pass</text>
  <rect class="box block" x="780" y="275" width="135" height="64"/><text class="label" x="848" y="303" text-anchor="middle">audited</text><text class="small" x="848" y="325" text-anchor="middle">block</text>
  <rect class="box block" x="965" y="275" width="115" height="64"/><text class="label" x="1023" y="312" text-anchor="middle">reverted</text>
  <rect class="box block" x="890" y="365" width="190" height="64"/><text class="label" x="985" y="391" text-anchor="middle">rollback</text><text class="small" x="985" y="413" text-anchor="middle">extracted</text>
  <rect class="box" x="965" y="80" width="115" height="64"/><text class="label" x="1023" y="117" text-anchor="middle">closed</text>
  <path class="edge green" d="M165 212 H215"/><path class="edge red" d="M103 244 C103 337 165 337 215 337"/><path class="edge green" d="M380 212 H430"/><path class="edge" d="M565 212 H615"/><path class="edge green" d="M730 212 C760 212 755 112 780 112"/><path class="edge red" d="M730 212 C760 212 755 307 780 307"/><path class="edge green" d="M915 112 H965"/><path class="edge red" d="M915 307 H965"/><path class="edge red" d="M1023 339 V365"/><path class="edge" d="M985 365 C985 235 1023 235 1023 144"/><path class="edge" d="M380 337 C705 337 760 112 965 112"/>
</svg>
